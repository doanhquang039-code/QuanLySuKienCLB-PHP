<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Attendance - ClubHub Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; display: flex; min-height: 100vh; color: #1F2937; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background-color: #0F172A; color: #9CA3AF; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-brand { font-family: 'Inter', sans-serif; font-size: 24px; color: white; padding: 0 20px 20px; border-bottom: 1px solid #1E293B; margin-bottom: 20px; }
        .sidebar-brand span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: normal; letter-spacing: 2px; margin-top: 4px; color: #64748B; text-transform: uppercase; }
        .sidebar-menu-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 20px 10px; color: #475569; }
        .sidebar-menu a { display: flex; align-items: center; padding: 12px 20px; color: #9CA3AF; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .sidebar-menu a:hover { color: white; }
        .sidebar-menu a.active { background-color: #F59E0B; color: white; font-weight: 500; border-radius: 4px; margin: 0 10px; padding: 12px 10px; width: calc(100% - 20px); }
        .sidebar-user { margin-top: auto; padding: 20px; border-top: 1px solid #1E293B; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #10B981; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .user-info { font-size: 14px; color: white; }
        .user-info span { display: block; font-size: 11px; color: #64748B; text-transform: uppercase; margin-top: 2px; }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-family: 'Inter', sans-serif; font-size: 32px; color: #111827; margin-bottom: 8px; }
        .header p { color: #6B7280; font-size: 14px; }

        /* Action Bar */
        .action-bar { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #111827; color: white; }
        .btn-primary:hover { background: #374151; }
        .btn-outline { background: white; border: 1px solid #E5E7EB; color: #374151; }
        .btn-outline:hover { background: #F9FAFB; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 16px; border: 1px solid #E5E7EB; background: white; border-radius: 6px; font-size: 14px; cursor: pointer; color: #4B5563; font-family: inherit; font-weight: 500; transition: all 0.2s; }
        .tab-btn.active { background: #F59E0B; color: white; border-color: #F59E0B; }
        .tab-btn:hover:not(.active) { background: #F9FAFB; }
        .search-bar { padding: 8px 16px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 14px; margin-left: auto; width: 250px; outline: none; }
        .search-bar:focus { border-color: #F59E0B; }

        /* Table Area */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #F3F4F6; overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9CA3AF; padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-weight: 500; white-space: nowrap; }
        td { padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-size: 14px; color: #374151; vertical-align: middle; }
        tr:hover { background-color: #F9FAFB; }
        
        .td-member { display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .td-member .avatar-sm { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; flex-shrink: 0; }
        .event-title { font-weight: 500; color: #111827; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        .badge-attended { background-color: #DBEAFE; color: #1E40AF; }
        .badge-attended::before { background: #3B82F6; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; border-radius: 12px; width: 400px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-family: 'Inter', sans-serif; font-size: 20px; color: #111827; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6B7280; }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #E5E7EB; display: flex; justify-content: flex-end; gap: 12px; background: #F9FAFB; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; padding-bottom: 24px; }
        .page-btn { padding: 6px 12px; border: 1px solid #E5E7EB; background: white; border-radius: 4px; font-size: 14px; cursor: pointer; color: #4B5563; }
        .page-btn.active { background: #111827; color: white; border-color: #111827; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/io.js"></script>
    <script>requireLogin(); requireRole("organizer");</script>

    <div class="sidebar">
        <div class="sidebar-brand">
            ClubHub
            <span>Management System</span>
        </div>
        <div class="sidebar-menu-title">Navigation</div>
        <div class="sidebar-menu">
            <a href="/views/organizer/dashboard.html">&#9675; B&#7843;ng &#273;i&#7873;u khi&#7875;n</a>
            <a href="/views/organizer/clubs.html">&#9672; C&#226;u l&#7841;c b&#7897;</a>
            <a href="/views/organizer/events.html">&#9679; S&#7921; ki&#7879;n</a>
            <a href="/views/organizer/registrations.html">&#9643; &#272;&#259;ng k&yacute;</a>
            <a href="/views/organizer/attendance.html" class="active">&#10003; &#272;i&#7875;m danh</a>
            <a href="/views/organizer/notifications.html">&#8857; Th&#244;ng b&aacute;o</a>
            
            <div class="sidebar-menu-title" style="margin-top: 20px;">System</div>
            <a href="/views/organizer/settings.html">⚙ Settings</a>
        </div>
        <div class="sidebar-user" id="sidebarUser"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Attendance</h1>
                <p id="totalCount">Loading...</p>
            </div>
            <div class="action-bar">
                <input type="file" id="csvImport" accept=".csv" style="display:none" onchange="handleImport(event)">
                <button class="btn btn-outline" onclick="document.getElementById('csvImport').click()">&#128229; Import CSV</button>
                <button class="btn btn-outline" onclick="exportData('excel')">&#128202; Export Excel</button>
                <button class="btn btn-primary" style="background:#4338CA" onclick="openScanner()">&#128247; Scan QR</button>
                <button class="btn btn-primary" onclick="openModal()">+ Add New</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="setFilter('all', this)">All Records</button>
            <button class="tab-btn" onclick="setFilter('pending', this)">Pending (Ch&#7901; x&#225;c nh&#7853;n)</button>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search member or event..." onkeyup="handleSearch()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Member Name</th>
                        <th>Event Title</th>
                        <th>Checked in at</th>
                        <th>Checked by</th>
                        <th>Status</th>
                        <th style="text-align:right">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- CRUD Modal -->
    <div class="modal-overlay" id="attModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Edit Attendance</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="attForm" onsubmit="saveAtt(event)">
                    <input type="hidden" id="attId">
                    <div class="form-group" id="groupEventId">
                        <label>Event</label>
                        <select id="aEventId" class="form-control" required></select>
                    </div>
                    <div class="form-group" id="groupUserId">
                        <label>Member</label>
                        <select id="aUserId" class="form-control" required></select>
                    </div>
                    <div class="form-group" id="groupCheckInBy">
                        <label>Checked In By</label>
                        <select id="aCheckInBy" class="form-control"></select>
                    </div>
                    <div class="form-group" id="groupCheckInAt">
                        <label>Checked In At</label>
                        <input type="datetime-local" id="aCheckInAt" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Note</label>
                        <input type="text" id="aNote" class="form-control" placeholder="Optional note...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" form="attForm">Save</button>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div class="modal-overlay" id="scannerModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Scan Check-in QR</h2>
                <button class="close-btn" onclick="closeScanner()">&times;</button>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; align-items:center;">
                <div id="reader" style="width:100%; max-width:400px;"></div>
                <div id="scanResult" style="margin-top:10px; font-weight:bold; color:#10B981;"></div>
            </div>
        </div>
    </div>

    <script>
        const colors = ['#B45309', '#1D4ED8', '#047857', '#6D28D9', '#BE123C'];
        let allAtts = [];
        let allPending = [];
        let allEvents = [];
        let allUsers = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentPage = 1;
        const itemsPerPage = 8;

        async function init() {
            const u = getUser();
            if(u) {
                const initials = (u.full_name || 'U').split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
                document.getElementById('sidebarUser').innerHTML = `
                    <div class="avatar">${initials}</div>
                    <div class="user-info">${u.full_name}<span>Quáº£n lÃ½</span></div>
                `;
            }

            // Load all data independently - don't let one failure block others
            await Promise.all([
                loadAtts(),
                loadPending(),
                loadUsers(),
                loadEvents()
            ]);
        }

        async function loadAtts() {
            try {
                const res = await apiCall('/attendance/all');
                allAtts = res.data || [];
                document.getElementById('totalCount').innerText = allAtts.length + ' ban ghi diem danh';
                if (currentFilter === 'all') renderTable();
            } catch (e) {
                console.error('loadAtts error:', e);
                if (currentFilter === 'all') {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Lá»—i táº£i dá»¯ liá»‡u Ä‘iá»ƒm danh: ${e.message}</td></tr>`;
                }
            }
        }

        async function loadPending() {
            try {
                const res = await apiCall('/registration/all');
                allPending = (res.data || []).filter(r => r.status === 'pending_verification');
                if (currentFilter === 'pending') renderTable();
            } catch (e) {
                console.error('loadPending error:', e);
            }
        }

        async function loadEvents() {
            try {
                const eRes = await apiCall('/event/index?limit=-1');
                allEvents = (eRes.data && eRes.data.data) ? eRes.data.data : [];
            } catch(e) { console.error('loadEvents error:', e); }
        }

        async function loadUsers() {
            try {
                const uRes = await apiCall('/user/list?limit=-1');
                allUsers = (uRes.data && uRes.data.data) ? uRes.data.data : [];
            } catch(e) { console.error('loadUsers error:', e); }
        }

        async function reloadAll() {
            await Promise.all([loadAtts(), loadPending(), loadUsers(), loadEvents()]);
            renderTable();
        }

        function setFilter(status, btn) {
            currentFilter = status;
            currentPage = 1;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            let filteredData = [];
            const isPendingTab = currentFilter === 'pending';
            
            if (isPendingTab) {
                filteredData = allPending;
            } else {
                filteredData = allAtts;
            }
            
            if (searchQuery) {
                if (isPendingTab) {
                    filteredData = filteredData.filter(d => 
                        (d.member_name || '').toLowerCase().includes(searchQuery) || 
                        (d.event_title || '').toLowerCase().includes(searchQuery)
                    );
                } else {
                    filteredData = filteredData.filter(d => 
                        (d.attendee_name || '').toLowerCase().includes(searchQuery) || 
                        (d.event_title || '').toLowerCase().includes(searchQuery)
                    );
                }
            }
            
            if(filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px 0; color: #9CA3AF;">Khong co ban ghi nao.</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedData = filteredData.slice(start, start + itemsPerPage);

            let html = '';
            paginatedData.forEach(item => {
                if (isPendingTab) {
                    // Pending tab: show registrations with pending_verification status
                    const memName = item.member_name || 'Unknown';
                    const initials = memName.split(' ').map(n=>n?n[0]:'').join('').substring(0,2).toUpperCase();
                    const color = colors[(item.user_id || 0) % colors.length];
                    const regDate = item.registered_at ? new Date(item.registered_at).toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '-';
                    
                    html += `
                    <tr>
                        <td style="color:#6B7280; font-family:monospace;">#REG-${item.id}</td>
                        <td class="td-member">
                            <div class="avatar-sm" style="background-color: ${color}">${initials}</div>
                            ${memName}
                        </td>
                        <td class="event-title">${item.event_title || '-'}</td>
                        <td style="color:#4B5563;">${regDate}</td>
                        <td style="color:#6B7280;">-</td>
                        <td><span class="badge badge-registered" style="background:#FEF3C7;color:#D97706;">Cho xac nhan</span></td>
                        <td style="text-align:right">
                            <button class="btn btn-primary" style="padding:4px 10px; font-size:12px; background:#10B981;" onclick="verifyAtt(${item.id})">&#10003; Xac nhan</button>
                        </td>
                    </tr>`;
                } else {
                    // All records tab: show confirmed attendance records
                    const attName = item.attendee_name || 'Unknown';
                    const initials = attName.split(' ').map(n=>n?n[0]:'').join('').substring(0,2).toUpperCase();
                    const color = colors[(item.attendee_id || 0) % colors.length];
                    const attDate = item.checked_in_at ? new Date(item.checked_in_at).toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '-';
                    
                    html += `
                    <tr>
                        <td style="color:#6B7280; font-family:monospace;">#ATT-${item.id}</td>
                        <td class="td-member">
                            <div class="avatar-sm" style="background-color: ${color}">${initials}</div>
                            ${attName}
                        </td>
                        <td class="event-title">${item.event_title || '-'}</td>
                        <td style="color:#4B5563;">${attDate}</td>
                        <td style="color:#6B7280;">${item.checker_name || 'Hệ thống'}</td>
                        <td><span class="badge badge-attended">Da diem danh</span></td>
                        <td style="text-align:right">
                            <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" onclick="openModal(${item.id})">&#9998;</button>
                            <button class="btn btn-outline" style="padding:4px 8px; font-size:12px; color:#991B1B; border-color:#FEE2E2;" onclick="deleteAtt(${item.id})">&#128465;</button>
                        </td>
                    </tr>`;
                }
            });
            tbody.innerHTML = html;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Truoc</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Tiep</button>`;
            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderTable();
        }

        // FORMAT HELPER FOR DATETIME-LOCAL INPUT
        function toDateTimeLocal(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '';
            const pad = n => n < 10 ? '0' + n : n;
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        // CRUD Logic
        function openModal(id = null) {
            document.getElementById('attModal').style.display = 'flex';
            
            // Populate Dropdowns
            const eSelect = document.getElementById('aEventId');
            eSelect.innerHTML = '<option value="">-- Chọn sự kiện --</option>' + allEvents.map(e => `<option value="${e.id}">${e.title}</option>`).join('');

            const uSelect = document.getElementById('aUserId');
            uSelect.innerHTML = '<option value="">-- Chọn thành viên --</option>' + allUsers.map(u => `<option value="${u.id}">${u.full_name} (${u.email})</option>`).join('');

            const cSelect = document.getElementById('aCheckInBy');
            cSelect.innerHTML = '<option value="">-- Người điểm danh --</option>' + allUsers.map(u => `<option value="${u.id}">${u.full_name}</option>`).join('');

            if (id) {
                document.getElementById('modalTitle').innerText = 'Sửa bản ghi điểm danh';
                const item = allAtts.find(c => c.id === id);
                if (!item) return;
                document.getElementById('attId').value = item.id;
                document.getElementById('aCheckInBy').value = item.checked_in_by || '';
                document.getElementById('aCheckInAt').value = toDateTimeLocal(item.checked_in_at);
                document.getElementById('aNote').value = item.note || '';

                // Hide event/user selects when editing (registration already set)
                document.getElementById('groupEventId').style.display = 'none';
                document.getElementById('groupUserId').style.display = 'none';
            } else {
                document.getElementById('modalTitle').innerText = 'Thêm điểm danh';
                document.getElementById('attForm').reset();
                document.getElementById('attId').value = '';
                document.getElementById('aCheckInBy').value = '';
                document.getElementById('aCheckInAt').value = toDateTimeLocal(new Date());
                document.getElementById('groupEventId').style.display = '';
                document.getElementById('groupUserId').style.display = '';
            }
        }

        function closeModal() {
            document.getElementById('attModal').style.display = 'none';
        }

        async function saveAtt(e) {
            e.preventDefault();
            const id = document.getElementById('attId').value;
            const formatDT = val => val ? val.replace('T', ' ') + ':00' : null;

            try {
                if (id) {
                    const data = {
                        checked_in_by: document.getElementById('aCheckInBy').value || null,
                        checked_in_at: formatDT(document.getElementById('aCheckInAt').value),
                        note: document.getElementById('aNote').value
                    };
                    Object.keys(data).forEach(key => { if(data[key] === null) delete data[key]; });
                    await apiCall('/attendance/update?id=' + id, 'PUT', data);
                    alert('Cập nhật thành công!');
                } else {
                    const eventId = document.getElementById('aEventId').value;
                    const userId = document.getElementById('aUserId').value;
                    
                    // Find the registration
                    const pendingReg = allPending.find(r => r.event_id == eventId && r.user_id == userId);
                    const allRegsRes = await apiCall(`/registration/byEvent?event_id=${eventId}`);
                    const regList = allRegsRes.data || [];
                    const reg = regList.find(r => r.user_id == userId);
                    
                    if (!reg) {
                        alert('Thành viên này chưa đăng ký sự kiện! Hãy thêm đăng ký trước.');
                        return;
                    }
                    await apiCall('/attendance/check-in', 'POST', {
                        registration_id: reg.id,
                        checked_in_by: document.getElementById('aCheckInBy').value || null,
                        note: document.getElementById('aNote').value
                    });
                    alert('Điểm danh thành công!');
                }
                closeModal();
                await reloadAll();
            } catch (err) {
                alert('Lỗi: ' + err.message);
            }
        }

        async function deleteAtt(id) {
            if(!confirm('Bạn có chắc muốn xóa bản ghi điểm danh này?')) return;
            try {
                await apiCall('/attendance/delete?id=' + id, 'DELETE');
                alert('Đã xóa!');
                await reloadAll();
            } catch (err) {
                alert('Lỗi: ' + err.message);
            }
        }

        async function verifyAtt(regId) {
            if(!confirm('Xac nhan diem danh cho thanh vien nay?')) return;
            try {
                await apiCall('/registration/verifyAttendance', 'POST', { registration_id: regId });
                alert('Xac nhan thanh cong! Thanh vien da nhan thong bao.');
                await reloadAll();
            } catch (err) {
                alert('Loi: ' + err.message);
            }
        }

        let html5QrcodeScanner = null;

        function openScanner() {
            document.getElementById('scannerModal').style.display = 'flex';
            document.getElementById('scanResult').innerText = '';
            
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function closeScanner() {
            document.getElementById('scannerModal').style.display = 'none';
            if(html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if(html5QrcodeScanner) html5QrcodeScanner.clear();
            
            if(decodedText.startsWith("REG-")) {
                const regId = decodedText.split("-")[1];
                document.getElementById('scanResult').innerText = "Äang xá»­ lÃ½ REG-" + regId + "...";
                document.getElementById('scanResult').style.color = "#F59E0B";
                
                try {
                    await apiCall('/attendance/check-in', 'POST', {
                        registration_id: regId,
                        note: 'Äiá»ƒm danh qua QR'
                    });
                    document.getElementById('scanResult').innerText = "Äiá»ƒm danh thÃ nh cÃ´ng!";
                    document.getElementById('scanResult').style.color = "#10B981";
                    setTimeout(() => {
                        closeScanner();
                        reloadAll();
                    }, 1500);
                } catch (err) {
                    document.getElementById('scanResult').innerText = "Lá»—i: " + err.message;
                    document.getElementById('scanResult').style.color = "#EF4444";
                    setTimeout(openScanner, 3000);
                }
            } else {
                document.getElementById('scanResult').innerText = "MÃ£ QR khÃ´ng há»£p lá»‡.";
                document.getElementById('scanResult').style.color = "#EF4444";
                setTimeout(openScanner, 3000);
            }
        }

        function onScanFailure(error) {
            // ignore
        }

        // Export/Import
        function exportData(type) {
            if (type === 'excel') {
                exportToCSV(allAtts, 'attendance_export', ['id', 'registration_id', 'attendee_name', 'event_title', 'checked_in_at', 'checker_name', 'note']);
            }
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            importCSV(file, async (data) => {
                let success = 0;
                for (let row of data) {
                    try {
                        if (row.registration_id) {
                            await apiCall('/attendance/check-in', 'POST', row);
                            success++;
                        }
                    } catch(err) { console.error(err); }
                }
                alert(`ÄÃ£ import ${success} báº£n ghi thÃ nh cÃ´ng!`);
                reloadAll();
                e.target.value = '';
            });
        }

        init();
    </script>
</body>
</html>
